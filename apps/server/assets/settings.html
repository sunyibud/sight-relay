<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sight Relay 设置</title><style>:root{--bg:#f5f8ff;--panel:#fff;--line:#e3eaf5;--text:#14213d;--muted:#75839e;--blue:#3f7cff;--green:#16a477}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f8fbff,#edf4ff);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh;max-width:1440px;margin:auto}.side{padding:30px 16px;background:rgba(248,251,255,.82);backdrop-filter:blur(16px);border-right:1px solid var(--line)}.side h2{margin:4px 12px 30px;font-size:20px;letter-spacing:-.02em}.nav button{display:block;width:100%;min-height:44px;padding:11px 14px;margin:3px 0;border:0;border-radius:10px;background:none;text-align:left;color:var(--muted);cursor:pointer;transition:background .18s,color .18s,transform .18s}.nav button:hover{background:#e7efff;color:#2457bd}.nav button.active{background:#e1ebff;color:#2457bd;font-weight:700;box-shadow:inset 3px 0 var(--blue)}.nav button:active{transform:scale(.96)}.main{min-width:0;padding:34px 42px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}.top h1{margin:0;font-size:26px;letter-spacing:-.03em}.status{padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.84);box-shadow:0 4px 14px rgba(31,52,89,.06);color:var(--muted);font-variant-numeric:tabular-nums}.status.online{color:var(--green)}.card{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(31,52,89,.08);margin-bottom:18px}.shot{min-height:380px;display:grid;place-items:center;background:#f3f6fb;border:1px solid #e4ebf5;border-radius:12px;overflow:hidden}.shot img{max-width:100%;max-height:65vh;object-fit:contain;outline:1px solid oklch(0 0 0 / 0.1)}.meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;color:var(--muted)}.list article{display:flex;align-items:center;gap:14px;min-height:96px;padding:14px 10px;border-bottom:1px solid var(--line);border-radius:10px;cursor:pointer;transition:background .15s,transform .15s}.list article:hover{background:#f5f8ff;transform:translateX(2px)}.thumb{width:132px;height:78px;object-fit:cover;border-radius:9px}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:16px;color:var(--muted)}button,input,select{font:inherit}.form{display:grid;gap:10px}.form label{color:var(--muted);font-size:12px}.form input,.form select,.form button,.pager button{min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:#fbfdff}.form button,.pager button{cursor:pointer;transition:transform .15s,box-shadow .15s}.form button:active,.pager button:active{transform:scale(.96)}.primary{background:var(--blue)!important;color:#fff;border-color:var(--blue)!important}.fab{position:fixed;left:18px;bottom:18px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--blue);text-decoration:none;box-shadow:0 8px 22px rgba(31,52,89,.13);font-weight:600}@media(max-width:800px){.app{display:block}.side{padding:14px}.side h2{margin:4px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:20px}.top h1{font-size:22px}.card{padding:18px}.shot{min-height:240px}}
</style></head><body><div class="app"><aside class="side"><h2>Sight Relay</h2><nav class="nav"><button class="active" data-p="latest">最新截图</button><button data-p="history">图片历史</button><button data-p="llm">LLM 配置与测试</button></nav></aside><main class="main"><header class="top"><h1 id="title">最新截图</h1><div class="status" id="status">Capture 检查中</div></header><section id="content"></section></main></div><a class="fab" href="/">← 返回主界面</a><script>
const $=s=>document.querySelector(s),content=$('#content');let page='latest',pageNo=1;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>new Date(s).toLocaleString('zh-CN',{hour12:false});
async function latest(){const h=await fetch('/api/v1/history?page=1&limit=1',{cache:'no-store'}).then(r=>r.json());if(!h.items.length){content.innerHTML='<div class="card">暂无截图记录</div>';return}const x=await fetch('/api/v1/captures/'+h.items[0].capture_id,{cache:'no-store'}).then(r=>r.json());content.innerHTML=`<section class="card"><h3>最新截图</h3><div class="shot"><img src="/api/v1/captures/${x.id}/image?v=${encodeURIComponent(x.received_at)}"></div><div class="meta"><span>设备：${esc(x.device_id)}</span><span>尺寸：${x.width} × ${x.height}</span><span>接收：${fmt(x.received_at)}</span><span>SHA-256：${x.sha256.slice(0,16)}…</span></div></section>`}
async function history(){if(window.__historyPanel)return window.__historyPanel(pageNo);const h=await fetch('/api/v1/history?page='+pageNo+'&limit=5').then(r=>r.json());content.innerHTML=`<section class="card list"><h3>图片历史</h3>${h.items.map(x=>`<article><img class="thumb" src="/api/v1/captures/${x.capture_id}/image?v=${x.received_at}" loading="lazy"><span><b>${esc(x.device_id)}</b><br><small>${fmt(x.received_at)} · ${x.task_count} 个任务</small></span></article>`).join('')}<div class="pager"><button onclick="pageNo=Math.max(1,pageNo-1);history()">上一页</button><span>第 ${h.page} 页 / ${Math.max(1,Math.ceil(h.total/h.page_size))}</span><button onclick="pageNo++;history()">下一页</button></div></section>`}
async function llm(){const x=await fetch('/api/v1/config/llm').then(r=>r.json());content.innerHTML=`<section class="card form"><h3>LLM 配置与测试</h3><label>Chat Completions Base URL</label><input id="base" value="${esc(x.base_url)}"><small class="muted">兼容 OpenAI /v1/chat/completions；可填写到 /v1，也可填写完整接口地址</small><label>VPN / HTTP 代理（仅 LLM 请求使用）</label><input id="proxy" value="${esc(x.proxy_url||'http://127.0.0.1:7890')}" placeholder="http://127.0.0.1:7890；留空直连"><small class="muted">Capture、图片、WebSocket 等 server 请求不会经过此代理</small><label>API Key（留空保持不变）</label><input id="key" type="password"><label>模型</label><input id="model" value="${esc(x.model)}"><label>推理等级</label><select id="reason"><option value="">自动（由模型决定）</option><option value="low">Low（较低）</option><option value="medium">Medium（平衡）</option><option value="high">High（较强）</option><option value="xhigh">XHigh（极强）</option><option value="max">Max（最高）</option></select><div><button class="primary" onclick="saveLlm()">保存并热切换</button> <button onclick="testLlm()">测试当前配置</button></div><div id="out"></div></section>`;reason.value=x.reasoning_effort||''}async function saveLlm(){const r=await fetch('/api/v1/config/llm',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({base_url:base.value,proxy_url:proxy.value,api_key:key.value,model:model.value,reasoning_effort:reason.value})});out.textContent=r.ok?'设置已保存，后续请求立即使用新配置':'保存失败'}async function testLlm(){const x=await fetch('/api/v1/config/test-llm',{method:'POST'}).then(r=>r.json());out.textContent=x.message}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));title.textContent=page==='latest'?'最新截图':page==='history'?'图片历史':page==='usage'?'使用记录':'LLM 配置与测试';page==='latest'?latest():page==='history'?history():page==='usage'?usage():llm()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.p;pageNo=1;render()});render();let ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/api/v1/ws`);ws.onopen=()=>{status.classList.add('online');status.textContent='Capture 连接正常'};ws.onclose=()=>{status.classList.remove('online');status.textContent='Capture 连接断开'};ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='capture_created'&&page==='latest')latest();if(m.type==='device_status'&&m.device)status.textContent=m.device.connected?'Capture 在线 · 心跳正常':'Capture 离线'}catch(_){}};setInterval(()=>{if(ws.readyState===1)ws.send(JSON.stringify({type:'viewer_ping'}))},10000);
</script><style>.status{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.9);font-variant-numeric:tabular-nums}.status-dot{width:8px;height:8px;border-radius:50%;background:#f59e0b}.status.online .status-dot{background:var(--green)}.status-grid{display:grid;grid-template-columns:auto auto;gap:2px 10px;font-size:12px}.status-grid b{grid-column:1/-1;font-size:13px;color:var(--text)}.status-grid span{white-space:nowrap}</style><script>
(()=>{const el=document.querySelector('#status');if(!el)return;el.innerHTML='<span class="status-dot"></span><div class="status-grid"><b id="connState">Server 检查中</b><span id="capState">Capture：未连接</span><span id="hbState">心跳：暂无</span><span id="reState">重连：0 次</span><span id="lastState">最近：暂无</span></div>';const state=(d,server=true)=>{const online=!!d?.connected;el.classList.toggle('online',online);document.querySelector('#connState').textContent=server?(online?'Capture 已连接':'Capture 未连接'):'Server 不可达';document.querySelector('#capState').textContent=online?'Capture：在线':'Capture：离线';document.querySelector('#hbState').textContent='心跳：'+(d?.heartbeat_count||0)+' 次';document.querySelector('#reState').textContent='重连：'+(d?.reconnect_count||0)+' 次';document.querySelector('#lastState').textContent='最近：'+(d?.last_heartbeat?new Date(d.last_heartbeat).toLocaleString('zh-CN',{hour12:false}):'暂无')};const poll=async()=>{try{const d=await fetch('/api/v1/devices',{cache:'no-store'}).then(r=>r.json());state(d.find(x=>x.connected)||d[0]||null)}catch(_){state(null,false)}};poll();setInterval(poll,10000);})();
</script><style>.top .status{padding:5px 9px;border-radius:9px;gap:6px;line-height:1.15;max-width:360px}.top .status-dot{width:6px;height:6px;flex:none}.top .status-grid{grid-template-columns:auto auto;gap:1px 8px;font-size:10px}.top .status-grid b{font-size:11px}.top .status-grid span{white-space:nowrap}</style></body></html>
