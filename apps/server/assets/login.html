<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sight Relay 登录</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f7fb;display:grid;place-items:center;height:100vh;margin:0;color:#17233c}.card{background:white;padding:32px;border-radius:18px;box-shadow:0 12px 40px #183b6418;width:min(360px,80vw)}input,button{width:100%;box-sizing:border-box;padding:12px;margin-top:12px;border:1px solid #d7dfed;border-radius:10px;font-size:16px}button{background:#2563eb;color:white;border:0;cursor:pointer}#err{color:#d33;margin-top:10px}</style><div class=card><h2>Sight Relay</h2><p>登录后管理截图与解析</p><input id=u placeholder=用户名 autocomplete=username><input id=p type=password placeholder=密码 autocomplete=current-password><button onclick=go()>登录</button><div id=err></div></div><script>async function go(){let r=await fetch('/api/v1/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:u.value,password:p.value})});if(r.ok)location.href='/';else err.textContent='用户名或密码错误'}</script>
